<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card-autenticacao">
        <p class="nome-sistema">Sistema</p>
        <h1 class="titulo-card">Criar conta</h1>
        <p class="subtitulo-card">Preencha os dados para se cadastrar.</p>

        <form method="POST" action="/cadastro">
            <div class="grupo-campo">
                <label class="rotulo-campo">Nome</label>
                <div class="wrapper-campo">
                    <input class="campo-input" type="text" name="nome" placeholder="Seu nome completo">
                </div>
            </div>

            <div class="grupo-campo">
                <label class="rotulo-campo">Email</label>
                <div class="wrapper-campo">
                    <input class="campo-input" type="email" name="email" placeholder="seu@email.com">
                </div>
            </div>

            <div class="grupo-campo">
                <label class="rotulo-campo">Senha</label>
                <div class="wrapper-campo">
                    <input class="campo-input campo-senha-input" type="password" name="senha" id="campo-senha" placeholder="••••••••">
                    <button class="botao-olhinho" type="button" onclick="alternarSenha()" aria-label="Mostrar senha">
                        <i class="ti ti-eye" id="icone-olho"></i>
                    </button>
                </div>
            </div>

            <div class="grupo-campo">
                <label class="rotulo-campo">Cargo</label>
                <div class="wrapper-campo">
                    <select class="campo-input" name="cargo">
                        <option value="usuario">Usuário</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
            </div>

            <button class="botao-enviar" type="submit">Cadastrar</button>
        </form>

        <div class="divisor">ou</div>
        <a class="link-pagina" href="/login">Já tem conta? Entrar</a>
    </div>

    <script>
    function alternarSenha() {
        const campo = document.getElementById('campo-senha')
        const icone = document.getElementById('icone-olho')
        if (campo.type === 'password') {
            campo.type = 'text'
            icone.className = 'ti ti-eye-off'
        } else {
            campo.type = 'password'
            icone.className = 'ti ti-eye'
        }
    }
    </script>
</body>
</html>
